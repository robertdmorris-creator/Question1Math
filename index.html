<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Division Visualizer</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Custom SVG Icons to replace the lucide-react imports ---
        const Icon = ({ children, size = 24, className = "", fill = "none" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"></polyline></Icon>;
        const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6"></polyline></Icon>;
        const Users = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></Icon>;
        const Square = (p) => <Icon {...p} fill={p.fill || "none"}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></Icon>;
        const RefreshCcw = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></Icon>;
        const ChefHat = (p) => <Icon {...p}><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"></path><line x1="6" y1="17" x2="18" y2="17"></line></Icon>;
        const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Minus = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Pointer = (p) => <Icon {...p}><path d="M22 14a8 8 0 0 1-8 8"></path><path d="M18 11v-1a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V9a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v1"></path><path d="M10 9.5V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v10"></path><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></Icon>;
        const Pizza = (p) => <Icon {...p}><path d="M15 11h.01"></path><path d="M11 15h.01"></path><path d="M16 16h.01"></path><path d="M2 16l20 6-6-20A20 20 0 0 0 2 16"></path><path d="M5.71 17.11a17.04 17.04 0 0 1 11.4-11.4"></path></Icon>;
        const Maximize = (p) => <Icon {...p}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></Icon>;
        const Minimize = (p) => <Icon {...p}><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></Icon>;

        // --- Main App Component ---
        function App() {
          const [step, setStep] = useState(0);
          const [sandboxDenom, setSandboxDenom] = useState(4);
          const [sandboxDivisor, setSandboxDivisor] = useState(3);
          const [sandboxTheme, setSandboxTheme] = useState('brownie');
          const [hasCut, setHasCut] = useState(false);
          const [countedPieces, setCountedPieces] = useState([]);
          const [isFullscreen, setIsFullscreen] = useState(false);

          // Fullscreen Toggle Logic
          const toggleFullscreen = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
          };

          useEffect(() => {
              const handleFullscreenChange = () => {
                  setIsFullscreen(!!document.fullscreenElement);
              };
              document.addEventListener('fullscreenchange', handleFullscreenChange);
              return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
          }, []);

          const changeStep = (newStep) => {
            setStep(newStep);
            setHasCut(false);
            setCountedPieces([]);
          };

          const nextStep = () => changeStep(Math.min(12, step + 1));
          const prevStep = () => changeStep(Math.max(0, step - 1));

          const TouchStepper = ({ value, min, max, onChange, label, colorClass, highlightClass }) => (
            <div className="flex flex-col items-center select-none touch-manipulation">
              <label className="font-bold text-stone-500 uppercase tracking-wider mb-3 text-sm">{label}</label>
              <div className="flex items-center gap-3 bg-white p-3 rounded-2xl shadow-sm border-2 border-stone-200">
                <button 
                  onClick={() => onChange(Math.max(min, value - 1))} 
                  disabled={value <= min}
                  className={`h-16 w-16 rounded-xl flex items-center justify-center text-3xl font-bold transition-colors disabled:opacity-30 disabled:cursor-not-allowed ${highlightClass} bg-stone-100 hover:bg-stone-200 active:scale-95`}
                >
                  <Minus size={32} />
                </button>
                <div className={`text-4xl font-extrabold w-16 text-center ${colorClass}`}>
                  {value}
                </div>
                <button 
                  onClick={() => onChange(Math.min(max, value + 1))} 
                  disabled={value >= max}
                  className={`h-16 w-16 rounded-xl flex items-center justify-center text-3xl font-bold transition-colors disabled:opacity-30 disabled:cursor-not-allowed ${highlightClass} bg-stone-100 hover:bg-stone-200 active:scale-95`}
                >
                  <Plus size={32} />
                </button>
              </div>
            </div>
          );

          const FractionGrid = ({ currentDenom, currentDivisor, showOriginalFraction, showCuts, showGhostGrid, showTargetPiece, interactiveMode, theme = 'brownie' }) => {
            const displayDivisor = showCuts ? currentDivisor : 1;
            let cells = [];
            for (let r = 0; r < displayDivisor; r++) {
              for (let c = 0; c < currentDenom; c++) {
                if (!showGhostGrid && c !== 0 && showCuts && r > 0) continue; 
                cells.push({ row: r, col: c });
              }
            }
            
            const themes = {
              brownie: {
                container: "bg-slate-300 border-slate-400",
                fraction: "bg-[#5D4037] border-[#3E2723]",
                target: "bg-[#8D6E63] border-[#4E342E]",
                empty: "bg-slate-200/60 border-slate-400/50",
                ghost: "bg-slate-100 border-slate-300"
              },
              pizza: {
                container: "bg-[#E8DCC4] border-[#C2A878]",
                fraction: "bg-[#FBBF24] border-[#F59E0B]",
                target: "bg-[#FCD34D] border-[#D97706]",
                empty: "bg-[#D1BFA0]/40 border-[#C2A878]/60",
                ghost: "bg-[#E8DCC4] border-[#C2A878]"
              }
            };
            const t = themes[theme];

            return (
              <div className={`relative p-3 rounded-[2rem] border-[12px] shadow-xl max-w-lg mx-auto w-full ${t.container}`}>
                {interactiveMode === 'cut' && !hasCut && (
                  <div className="absolute -top-10 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-5 py-3 rounded-full font-bold shadow-lg animate-bounce flex items-center gap-3 z-20 pointer-events-none whitespace-nowrap">
                    <Pointer size={24} /> Tap the {theme} to cut!
                  </div>
                )}

                <div 
                  onClick={() => { if (interactiveMode === 'cut' && !hasCut) setHasCut(true); }}
                  className={`w-full aspect-video grid gap-2 select-none touch-manipulation transition-all duration-300 ${interactiveMode === 'cut' && !hasCut ? 'cursor-pointer hover:scale-[1.02]' : ''}`}
                  style={{ gridTemplateColumns: `repeat(${currentDenom}, minmax(0, 1fr))`, gridTemplateRows: `repeat(${displayDivisor}, minmax(0, 1fr))` }}
                >
                  {cells.map((cell) => {
                    const { row, col } = cell;
                    const i = row * currentDenom + col; 
                    let cellStyle = {};
                    let bgColor = ""; 
                    let content = null;
                    let isCounted = countedPieces.includes(i);
                    
                    if (!showGhostGrid && col !== 0 && showCuts) cellStyle.gridRow = '1 / -1';

                    if (col === 0) {
                      bgColor = `${t.fraction} border-4 shadow-inner`; 
                      if (showTargetPiece && row === 0) {
                        bgColor = `${t.target} border-4 shadow-2xl transform scale-[1.05] z-10`;
                        if (interactiveMode !== 'count') content = <span className={`${theme === 'brownie' ? 'text-white' : 'text-amber-900'} font-black text-3xl md:text-5xl drop-shadow-md`}>1</span>;
                      }
                    } else {
                      if (!showGhostGrid) {
                        bgColor = `${t.empty} border-4 border-dashed flex items-center justify-center`;
                        content = <span className={`${theme === 'brownie' ? 'text-slate-400' : 'text-[#A38A60]'} font-bold tracking-widest uppercase text-xs md:text-sm -rotate-90 md:rotate-0`}>Eaten</span>;
                      } else {
                        bgColor = `${t.ghost} border-4 border-dashed opacity-80`;
                      }
                    }

                    if (interactiveMode === 'count' && (showGhostGrid || col === 0)) {
                      if (isCounted) {
                        bgColor = "bg-green-400 border-4 border-green-600 shadow-inner transform scale-95 transition-all";
                        content = <span className="text-green-900 font-black text-2xl md:text-4xl">{countedPieces.indexOf(i) + 1}</span>;
                      } else if (showGhostGrid || col === 0) {
                         bgColor += " cursor-pointer hover:scale-105 hover:shadow-md transition-all";
                      }
                    }

                    return (
                      <div 
                        key={i} style={cellStyle}
                        onClick={(e) => {
                          if (interactiveMode === 'count' && !isCounted && (showGhostGrid || col === 0)) {
                            e.stopPropagation();
                            setCountedPieces([...countedPieces, i]);
                          }
                        }}
                        className={`rounded-xl flex items-center justify-center transition-all duration-300 ${bgColor}`}
                      >
                        {content}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          };

          const FractionCircle = ({ currentDenom, currentDivisor, showOriginalFraction, showCuts, showGhostGrid, showTargetPiece, interactiveMode }) => {
            const totalSlices = currentDenom * currentDivisor;
            const anglePerSlice = 360 / totalSlices;
            const radius = 95;
            const cx = 100;
            const cy = 100;
            let wedges = [];

            for (let c = 0; c < currentDenom; c++) {
              const isOriginalFraction = (c === 0);
              const isEaten = !isOriginalFraction;

              if (showCuts && (isOriginalFraction || showGhostGrid)) {
                for (let r = 0; r < currentDivisor; r++) {
                  const sliceIndex = c * currentDivisor + r;
                  const startAngle = sliceIndex * anglePerSlice;
                  const endAngle = (sliceIndex + 1) * anglePerSlice;
                  const isTarget = isOriginalFraction && r === 0;
                  wedges.push({ id: sliceIndex, startAngle, endAngle, isEaten, isTarget, isGrouped: false, isOriginalFraction });
                }
              } else {
                const startAngle = (c * currentDivisor) * anglePerSlice;
                const endAngle = ((c + 1) * currentDivisor) * anglePerSlice;
                wedges.push({ id: c * currentDivisor, startAngle, endAngle, isEaten, isTarget: false, isGrouped: true, isOriginalFraction });
              }
            }

            function polarToCartesian(centerX, centerY, r, angleInDegrees) {
              const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
              return { x: centerX + (r * Math.cos(angleInRadians)), y: centerY + (r * Math.sin(angleInRadians)) };
            }

            function describeArc(x, y, r, startAngle, endAngle){
                if (endAngle - startAngle >= 360) {
                    return `M ${x} ${y - r} A ${r} ${r} 0 1 1 ${x} ${y + r} A ${r} ${r} 0 1 1 ${x} ${y - r} Z`;
                }
                const start = polarToCartesian(x, y, r, startAngle);
                const end = polarToCartesian(x, y, r, endAngle);
                const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
                return ["M", x, y, "L", start.x, start.y, "A", r, r, 0, largeArcFlag, 1, end.x, end.y, "Z"].join(" ");
            }

            return (
              <div className="relative p-4 rounded-[2rem] border-[8px] shadow-xl max-w-sm mx-auto w-full bg-[#E8DCC4] border-[#C2A878] aspect-square flex items-center justify-center">
                  {interactiveMode === 'cut' && !hasCut && (
                    <div className="absolute -top-12 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-5 py-3 rounded-full font-bold shadow-lg animate-bounce flex items-center gap-3 z-20 pointer-events-none whitespace-nowrap">
                      <Pointer size={24} /> Tap the pizza to slice it!
                    </div>
                  )}

                  <svg viewBox="0 0 200 200" className={`w-full h-full select-none touch-manipulation drop-shadow-xl transition-transform duration-300 ${interactiveMode === 'cut' && !hasCut ? 'cursor-pointer hover:scale-[1.05]' : ''}`} onClick={() => { if (interactiveMode === 'cut' && !hasCut) setHasCut(true); }}>
                    {wedges.map((wedge, idx) => {
                      const isCounted = countedPieces.includes(wedge.id);
                      const pathData = describeArc(cx, cy, radius, wedge.startAngle, wedge.endAngle);
                      let fill = "", stroke = "", strokeWidth = "2", strokeDasharray = "none", transform = "";

                      if (wedge.isOriginalFraction) {
                        fill = "#FBBF24"; stroke = "#F59E0B";
                        if (showTargetPiece && wedge.isTarget) {
                          fill = "#FCD34D"; stroke = "#D97706"; strokeWidth = "4";
                          const midAngle = (wedge.startAngle + wedge.endAngle) / 2;
                          const shift = polarToCartesian(0, 0, 8, midAngle);
                          if (interactiveMode !== 'count') transform = `translate(${shift.x}, ${shift.y})`;
                        }
                      } else {
                        if (wedge.isGrouped) { fill = "rgba(209, 191, 160, 0.4)"; stroke = "rgba(194, 168, 120, 0.6)"; strokeDasharray = "6,4"; } 
                        else { fill = "rgba(232, 220, 196, 0.8)"; stroke = "#C2A878"; strokeDasharray = "6,4"; }
                      }

                      if (interactiveMode === 'count' && (showGhostGrid || wedge.isOriginalFraction)) {
                        if (isCounted) {
                          fill = "#4ADE80"; stroke = "#16A34A"; strokeWidth = "4";
                          const midAngle = (wedge.startAngle + wedge.endAngle) / 2;
                          const shift = polarToCartesian(0, 0, -3, midAngle);
                          transform = `translate(${shift.x}, ${shift.y}) scale(0.96)`;
                        }
                      }

                      const midAngle = (wedge.startAngle + wedge.endAngle) / 2;
                      const textPos = polarToCartesian(cx, cy, radius * 0.65, midAngle);

                      return (
                        <g key={idx} style={{ transformOrigin: '100px 100px', transform }} className={`transition-all duration-300 ${interactiveMode === 'count' && !isCounted && (showGhostGrid || wedge.isOriginalFraction) ? 'cursor-pointer hover:opacity-80' : ''}`} onClick={(e) => { if (interactiveMode === 'count' && !isCounted && (showGhostGrid || wedge.isOriginalFraction)) { e.stopPropagation(); setCountedPieces([...countedPieces, wedge.id]); } }}>
                          <path d={pathData} fill={fill} stroke={stroke} strokeWidth={strokeWidth} strokeDasharray={strokeDasharray} className="transition-all duration-300" />
                          {wedge.isEaten && !showGhostGrid && ( <text x={textPos.x} y={textPos.y} fill="#A38A60" fontSize="14" fontWeight="bold" textAnchor="middle" dominantBaseline="middle">EATEN</text> )}
                          {showTargetPiece && wedge.isTarget && interactiveMode !== 'count' && ( <text x={textPos.x} y={textPos.y} fill="#92400E" fontSize="28" fontWeight="900" textAnchor="middle" dominantBaseline="middle">1</text> )}
                          {interactiveMode === 'count' && isCounted && ( <text x={textPos.x} y={textPos.y} fill="#064E3B" fontSize="28" fontWeight="900" textAnchor="middle" dominantBaseline="middle">{countedPieces.indexOf(wedge.id) + 1}</text> )}
                        </g>
                      );
                    })}
                  </svg>
              </div>
            );
          };

          const stepsData = [
            { title: "Problem 1: The Brownie Pan", content: "Imagine you baked a huge pan of brownies. But, your family already ate most of it! Let's look at what is left.", visual: <ChefHat size={140} className="mx-auto text-[#5D4037] mb-6 animate-bounce drop-shadow-lg" />, action: "Start Problem 1", isNextDisabled: false },
            { title: "Step 1: The Leftovers", content: ( <div className="text-2xl leading-relaxed">You only have <strong className="text-[#5D4037] bg-stone-200 px-2 rounded">1/4</strong> of the pan of brownies left. <br/><br/><span className="text-lg text-stone-500">The dark chocolate section is your brownie. The light, dotted spaces show the 3/4 of the pan that is already eaten!</span></div> ), visual: <FractionGrid theme="brownie" currentDenom={4} currentDivisor={3} showOriginalFraction={true} showCuts={false} showGhostGrid={false} showTargetPiece={false} interactiveMode="none" />, action: "Next Step", isNextDisabled: false },
            { title: "Step 2: Time to Share", content: ( <div className="text-2xl leading-relaxed">You want to share this 1/4 piece equally among yourself and 2 friends (<strong className="text-blue-600 bg-blue-100 px-2 rounded">3 people total</strong>).<div className="flex justify-center items-center gap-4 mt-6 text-4xl font-black text-blue-800 bg-blue-50 p-6 rounded-2xl border-4 border-blue-200 shadow-sm"><span>1/4</span> <span className="text-blue-300">&divide;</span> <span>3</span></div></div> ), visual: ( <div className="flex justify-center items-center gap-8 w-full"><FractionGrid theme="brownie" currentDenom={4} currentDivisor={3} showOriginalFraction={true} showCuts={false} showGhostGrid={false} showTargetPiece={false} interactiveMode="none" /><div className="flex flex-col gap-4">{[1, 2, 3].map(i => <div key={i} className="bg-blue-100 p-3 rounded-full shadow-sm border-2 border-blue-200"><Users size={40} className="text-blue-600" /></div>)}</div></div> ), action: "Get ready to cut!", isNextDisabled: false },
            { title: "Step 3: Make the Cuts!", content: ( <div className="text-2xl leading-relaxed">We need to cut the leftover brownie piece into <strong>3 equal slices</strong>.<br/><br/><span className="text-blue-600 font-bold bg-blue-50 p-2 rounded-lg block border border-blue-200">👉 Tap the brownie on the board to make the cuts!</span></div> ), visual: <FractionGrid theme="brownie" currentDenom={4} currentDivisor={3} showOriginalFraction={true} showCuts={hasCut} showGhostGrid={false} showTargetPiece={hasCut} interactiveMode="cut" />, action: "See the Whole Pan", isNextDisabled: !hasCut },
            { title: "Step 4: Count the Pieces!", content: ( <div className="text-2xl leading-relaxed">The lighter piece is your single slice. But what fraction of the <em>whole</em> pan is it?<br/><br/><span className="text-green-700 font-bold bg-green-50 p-2 rounded-lg block border border-green-200">👉 Tap EVERY piece inside the whole pan to count how many slices it takes to make a whole!</span></div> ), visual: <FractionGrid theme="brownie" currentDenom={4} currentDivisor={3} showOriginalFraction={true} showCuts={true} showGhostGrid={true} showTargetPiece={true} interactiveMode="count" />, action: "Reveal Final Answer", isNextDisabled: countedPieces.length < 12 },
            { title: "Step 5: The Final Answer", content: ( <div className="text-2xl leading-relaxed">Great job counting! Because we split the 4 columns into 3 rows, there are <strong className="text-green-600">12 pieces total</strong> in the pan.<br/>Your piece is 1 out of 12.<br/><div className="mt-6 p-6 bg-green-100 rounded-2xl border-4 border-green-300 text-center font-black text-5xl text-green-800 shadow-md">1/4 &divide; 3 = 1/12</div></div> ), visual: <FractionGrid theme="brownie" currentDenom={4} currentDivisor={3} showOriginalFraction={true} showCuts={true} showGhostGrid={true} showTargetPiece={true} interactiveMode="none" />, action: "Try Problem 2!" },
            { title: "Problem 2: The Pizza Box", content: "Let's try another one! Jacob ordered a large, rectangular school pizza. Let's look inside the cardboard box...", visual: <Pizza size={140} className="mx-auto text-[#F59E0B] mb-6 animate-pulse drop-shadow-lg" />, action: "Start Problem 2", isNextDisabled: false },
            { title: "Step 1: The Leftovers", content: ( <div className="text-2xl leading-relaxed">There is <strong className="text-[#D97706] bg-yellow-100 px-2 rounded">1/2</strong> of the pizza left in the box. <br/><br/><span className="text-lg text-stone-500">The yellow section is the leftover cheese pizza. The empty side shows the 1/2 of the pizza that was already eaten!</span></div> ), visual: <FractionCircle currentDenom={2} currentDivisor={2} showOriginalFraction={true} showCuts={false} showGhostGrid={false} showTargetPiece={false} interactiveMode="none" />, action: "Next Step", isNextDisabled: false },
            { title: "Step 2: Time to Share", content: ( <div className="text-2xl leading-relaxed">Jacob wants to share the leftovers with his brother (<strong className="text-blue-600 bg-blue-100 px-2 rounded">2 people total</strong>).<div className="flex justify-center items-center gap-4 mt-6 text-4xl font-black text-blue-800 bg-blue-50 p-6 rounded-2xl border-4 border-blue-200 shadow-sm"><span>1/2</span> <span className="text-blue-300">&divide;</span> <span>2</span></div></div> ), visual: ( <div className="flex justify-center items-center gap-8 w-full"><FractionCircle currentDenom={2} currentDivisor={2} showOriginalFraction={true} showCuts={false} showGhostGrid={false} showTargetPiece={false} interactiveMode="none" /><div className="flex flex-col gap-4">{[1, 2].map(i => <div key={i} className="bg-blue-100 p-3 rounded-full shadow-sm border-2 border-blue-200"><Users size={40} className="text-blue-600" /></div>)}</div></div> ), action: "Get ready to cut!", isNextDisabled: false },
            { title: "Step 3: Make the Cuts!", content: ( <div className="text-2xl leading-relaxed">We need to cut the leftover pizza piece into <strong>2 equal slices</strong>.<br/><br/><span className="text-blue-600 font-bold bg-blue-50 p-2 rounded-lg block border border-blue-200">👉 Tap the pizza on the board to slice it!</span></div> ), visual: <FractionCircle currentDenom={2} currentDivisor={2} showOriginalFraction={true} showCuts={hasCut} showGhostGrid={false} showTargetPiece={hasCut} interactiveMode="cut" />, action: "See the Whole Box", isNextDisabled: !hasCut },
            { title: "Step 4: Count the Pieces!", content: ( <div className="text-2xl leading-relaxed">The bright yellow piece is Jacob's slice. But what fraction of the <em>whole</em> pizza is it?<br/><br/><span className="text-green-700 font-bold bg-green-50 p-2 rounded-lg block border border-green-200">👉 Tap EVERY piece inside the whole box to count how many slices it takes to make a whole!</span></div> ), visual: <FractionCircle currentDenom={2} currentDivisor={2} showOriginalFraction={true} showCuts={true} showGhostGrid={true} showTargetPiece={true} interactiveMode="count" />, action: "Reveal Final Answer", isNextDisabled: countedPieces.length < 4 },
            { title: "Step 5: The Final Answer", content: ( <div className="text-2xl leading-relaxed">Awesome! Because we split the 2 halves into 2 slices each, there are <strong className="text-green-600">4 pieces total</strong> in the box.<br/>Jacob's piece is 1 out of 4.<br/><div className="mt-6 p-6 bg-green-100 rounded-2xl border-4 border-green-300 text-center font-black text-5xl text-green-800 shadow-md">1/2 &divide; 2 = 1/4</div></div> ), visual: <FractionCircle currentDenom={2} currentDivisor={2} showOriginalFraction={true} showCuts={true} showGhostGrid={true} showTargetPiece={true} interactiveMode="none" />, action: "Try the Sandbox" }
          ];

          return (
            <div className="min-h-screen bg-stone-200 text-stone-800 font-sans p-4 md:p-8 flex items-center justify-center select-none touch-manipulation">
