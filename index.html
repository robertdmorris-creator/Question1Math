<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Division Visualizer</title>
    
    <style>
        body { font-family: sans-serif; background-color: #f5f5f4; margin: 0; }
        #error-log { display: none; background: #fee2e2; border: 4px solid #ef4444; color: #991b1b; padding: 20px; margin: 20px; border-radius: 12px; font-weight: bold; font-family: monospace; white-space: pre-wrap;}
    </style>
    <script>
        // Catch and display standard errors
        window.addEventListener('error', function(e) {
            const log = document.getElementById('error-log');
            log.style.display = 'block';
            log.innerHTML += 'Error: ' + e.message + '\nSource: ' + e.filename + ':' + e.lineno + '\n\n';
        });
        
        // Catch and display console errors (like Babel compilation failures)
        const originalConsoleError = console.error;
        console.error = function(...args) {
            const log = document.getElementById('error-log');
            if(log) {
                log.style.display = 'block';
                log.innerHTML += 'Console Error: ' + args.join(' ') + '\n\n';
            }
            originalConsoleError.apply(console, args);
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
